# Test configuration for "Library" tests

# SQL Script Initialization
# Use static SQL files to ensure consistent schema without auto-generated indexes
spring.sql.init.schema-locations=classpath:schema-library.sql
spring.sql.init.data-locations=classpath:data-library.sql

# Keep test output focused on failures; enable these categories locally when debugging.
logging.level.io.github.jespersm.jpa.tripwire.test.library=ERROR
