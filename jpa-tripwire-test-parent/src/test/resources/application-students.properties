# Test configuration for "Students" tests

# SQL Script Initialization
# Use static SQL files to ensure consistent schema without auto-generated indexes
spring.sql.init.schema-locations=classpath:schema-students.sql
spring.sql.init.data-locations=classpath:data-students.sql

# Keep test output focused on failures; enable these categories locally when debugging.
logging.level.io.github.jespersm.jpa.tripwire.test.students=ERROR
