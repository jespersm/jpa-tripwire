# Test configuration
# Testcontainers will override the datasource URL dynamically

# SQL Script Initialization
# Use static SQL files to ensure consistent schema without auto-generated indexes
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=false

# JPA/Hibernate Configuration
# Don't let Hibernate create schema - we use schema.sql instead
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Keep test output focused on failures; enable these categories locally when debugging.
spring.main.banner-mode=off
logging.level.org.hibernate=ERROR
logging.level.org.springframework=ERROR
logging.level.io.github.jespersm.jpa.tripwire.test=ERROR
logging.level.io.github.jespersm.jpa.tripwire.librarytest=ERROR
logging.level.com.zaxxer.hikari=ERROR
logging.level.org.reflections=ERROR
logging.level.org.testcontainers=ERROR
logging.level.tc=ERROR
# Tripwire warnings are the behavior under test and are asserted by the tests.
logging.level.io.github.jespersm.jpa.tripwire.unselectinator.core.EntityLoadTracker=ERROR
