name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to publish (for example, v1.0.0)'
        required: true
        type: string
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_version: ${{ steps.release.outputs.version }}
      release_tag: ${{ steps.release.outputs.tag_name }}
      release_sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: maven
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  publish-release:
    if: >-
      always() && !cancelled() &&
      github.ref == 'refs/heads/main' && github.ref_protected == true &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true'))
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: central-releases
    permissions:
      contents: read
    env:
      CENTRAL_TOKEN_USER: ${{ secrets.CENTRAL_TOKEN_USER }}
      CENTRAL_TOKEN_PASS: ${{ secrets.CENTRAL_TOKEN_PASS }}
      RELEASE_TAG: ${{ inputs.release_tag || needs.release-please.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.release-please.outputs.release_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USER
          server-password: CENTRAL_TOKEN_PASS
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Verify checked-out release version
        run: |
          if [[ -z "$RELEASE_VERSION" ]]; then
            [[ "$RELEASE_TAG" == v* ]] || { echo "Expected a release tag starting with v"; exit 1; }
            RELEASE_VERSION=${RELEASE_TAG#v}
          fi
          version=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)
          test "$version" = "$RELEASE_VERSION"
          [[ "$version" != *-SNAPSHOT ]] || { echo "Cannot publish a SNAPSHOT as a release"; exit 1; }
          echo "Publishing release $version ($RELEASE_TAG)"

      - name: Publish release to Central
        run: ./mvnw -B -Prelease -DskipTests deploy
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

